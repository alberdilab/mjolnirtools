[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mjolnirtools"
version = "1.1.6"
description = "Beginner-friendly shortcuts for common Mjolnir HPC workflows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Mjolnir HPC administrators" }
]
keywords = ["hpc", "slurm", "cluster", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Systems Administration"
]
dependencies = [
  "click>=8,<9",
  "rich>=13,<15",
  "typer>=0.12,<1"
]

[project.optional-dependencies]
docs = [
  "Sphinx>=7,<9",
  "sphinx-rtd-theme>=2.0"
]

[project.scripts]
mt = "mjolnirtools.cli:main"
mjolnirtools = "mjolnirtools.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
